kind = "web"
previewPath = "/"
title = "dbudg"
version = "1.0.0"
id = "artifacts/dbudg"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20859

[services.development]
run = "pnpm --filter @workspace/dbudg run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dbudg", "run", "build" ]
publicDir = "artifacts/dbudg/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20859"
BASE_PATH = "/"
